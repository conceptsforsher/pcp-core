name: Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-unity

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libsodium-dev libsqlite3-dev ninja-build

      - name: Configure (unity build)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPCP_CORE_UNITY=ON -DCMAKE_WARN_DEPRECATED=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package artifacts
        run: |
          mkdir -p package
          cp build/libpcp_native.a build/libpcp_core.a package/
          tar czf pcp-core-x86_64.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: core-x86_64
          path: pcp-core-x86_64.tar.gz
          retention-days: 5

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev libsodium-dev libsqlite3-dev

      - name: Configure (unity build, native aarch64)
        run: cmake -S . -B build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DPCP_CORE_UNITY=ON -DCMAKE_WARN_DEPRECATED=OFF

      - name: Build (aarch64)
        run: cmake --build build-arm64 -j4

      - name: Package artifacts
        run: |
          mkdir -p package
          cp build-arm64/libpcp_native.a build-arm64/libpcp_core.a package/
          tar czf pcp-core-aarch64.tar.gz -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: core-aarch64
          path: pcp-core-aarch64.tar.gz
          retention-days: 5

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish per-commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-${{ github.sha }}
          name: Core ${{ github.sha }}
          body: Prebuilt pcp-core for ${{ github.sha }} (x86_64 + aarch64). Consumed by pcp-desktop / pcp-cli when PCP_CORE_USE_ARTIFACT=ON.
          files: artifacts/pcp-core-*.tar.gz
          fail_on_unmatched_files: false
